services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ann
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ann
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      JWT_SECRET: change-me
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_MINUTES: 1440
      REDIS_URL: redis://redis:6379/0
      MEDIA_DIR: /data/media
      ARTIFACTS_DIR: /data/artifacts
      MODEL_DEVICE: auto
      YOLO_MODEL: yolov8n.pt
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - backend_data:/data

  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "worker", "--loglevel=INFO"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ann
      REDIS_URL: redis://redis:6379/0
      MEDIA_DIR: /data/media
      ARTIFACTS_DIR: /data/artifacts
      MODEL_DEVICE: auto
      YOLO_MODEL: yolov8n.pt
    depends_on:
      - db
      - redis
    volumes:
      - backend_data:/data

  frontend:
    build:
      context: ./frontend
    environment:
      # Force IPv6 loopback to avoid conflicts on 127.0.0.1:8000
      VITE_API_BASE: http://[::1]:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_data:

